<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mi Música</title>
<style>
:root{--bg:#121212;--el:#1f1f1f;--hov:#2a2a2a;--txt:#fff;--soft:#b3b3b3;--g:#1ed760}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;display:block}
main{padding:16px 16px 190px;min-height:100vh}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 16px}
h2{font-size:1.3rem;font-weight:800;margin:24px 0 12px}
.view{display:none}.view.on{display:block}

/* navegación */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 40%)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--soft);flex:1;padding-top:10px}
#nav button.on{color:#fff}
.logo{display:none}

/* inicio */
.atajos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.atajo{display:flex;align-items:center;gap:8px;background:#ffffff1a;border-radius:4px;overflow:hidden;height:56px;text-align:left}
.atajo:active{background:#ffffff33}
.atajo img{width:56px;height:56px;object-fit:cover}
.atajo b{font-size:.8rem;padding-right:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fila{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fila::-webkit-scrollbar{display:none}
.card{flex:0 0 140px;text-align:left}
.card img{width:140px;height:140px;object-fit:cover;border-radius:6px;background:var(--el);margin-bottom:8px}
.card b,.card span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card b{font-size:.9rem}.card span{font-size:.8rem;color:var(--soft);margin-top:2px}

/* buscar */
.caja{display:flex;align-items:center;gap:8px;background:#fff;color:#121212;border-radius:6px;padding:0 12px;height:48px}
.caja input{flex:1;min-width:0;border:0;outline:0;font-size:1rem;font-weight:600;background:none;color:#121212}
.generos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gen{height:96px;border-radius:8px;padding:12px;text-align:left;font-weight:800;font-size:1.05rem;position:relative;overflow:hidden}

/* listas */
.fila-t{display:flex;align-items:center;gap:12px;padding:6px 0}
.fila-t img{width:48px;height:48px;border-radius:4px;object-fit:cover;background:var(--el)}
.fila-t .inf{flex:1;min-width:0;text-align:left}
.fila-t b,.fila-t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-t b{font-size:1rem;font-weight:500}
.fila-t span{font-size:.85rem;color:var(--soft);margin-top:2px}
.fila-t.suena b{color:var(--g)}
.heart{color:var(--soft);padding:6px}.heart.on{color:var(--g)}
.cab{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.cab .vol{padding:4px;margin-left:-4px}
.acciones{display:flex;align-items:center;gap:20px;margin:12px 0 8px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center}
.bigplay svg{width:28px;height:28px}
.bigplay:active{transform:scale(.95)}
.meGusta{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.meGusta .ic{width:56px;height:56px;border-radius:4px;background:linear-gradient(135deg,#450af5,#c4efd9);display:grid;place-items:center}
.meGusta b{display:block}.meGusta span{font-size:.85rem;color:var(--soft)}
.copia{display:flex;gap:8px;margin-top:20px}
.copia button{flex:1;border:1px solid #727272;border-radius:20px;padding:8px;font-size:.85rem;font-weight:700}
.msg{color:var(--soft);padding:24px 0;text-align:center}

/* mini reproductor */
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:8px;background:#5b3a52;padding:8px;display:none;align-items:center;gap:10px;overflow:hidden}
#mini.on{display:flex}
#mini img{width:40px;height:40px;border-radius:4px;object-fit:cover}
#mini .inf{flex:1;min-width:0;text-align:left}
#mini b,#mini span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini b{font-size:.85rem}#mini span{font-size:.75rem;opacity:.75}
#mini .prog{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#ffffff4d}
#mini .prog i{display:block;height:100%;width:0;background:#fff}

/* reproductor completo */
#full{position:fixed;inset:0;z-index:30;background:linear-gradient(#5b3a52,#121212 75%);padding:calc(16px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s}
#full.on{transform:none}
#full .top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:700}
#full .top svg{width:28px;height:28px}
#full .cover{flex:1;display:grid;place-items:center;min-height:0;padding:16px 0}
#ytwrap{width:100%;max-width:420px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 8px 32px #0008}
#ytwrap iframe{width:100%;height:100%;display:block}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:50;background:#fff;color:#000;padding:12px 14px;border-radius:8px;font-weight:600;font-size:.9rem;display:none}
#full .tit{display:flex;align-items:center;gap:12px}
#full .tit div{flex:1;min-width:0;text-align:left}
#full .tit b{display:block;font-size:1.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#full .tit span{color:var(--soft)}
#full .heart svg{width:28px;height:28px}
#barra{width:100%;margin:16px 0 0;accent-color:#fff;height:4px}
.tiempos{display:flex;justify-content:space-between;font-size:.72rem;color:var(--soft);margin-top:4px}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.ctrl svg{width:30px;height:30px}
.ctrl .on{color:var(--g)}
.ctrl .pp{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.ctrl .pp svg{width:32px;height:32px}

/* escritorio */
@media(min-width:800px){
  #nav{top:0;bottom:auto;right:auto;width:230px;flex-direction:column;justify-content:flex-start;background:#000;padding:24px 12px;gap:4px;height:calc(100vh - 80px)}
  #nav button{flex-direction:row;font-size:1rem;font-weight:700;gap:16px;padding:10px 12px;flex:none}
  .logo{display:block;font-weight:800;font-size:1.3rem;padding:0 12px 20px}
  main{margin-left:230px;padding:24px 32px 120px}
  #mini{left:0;right:0;bottom:0;border-radius:0;height:80px;background:#000;padding:12px 16px}
  #mini .prog{left:0;right:0}
  .atajos{grid-template-columns:repeat(3,1fr)}
  .generos{grid-template-columns:repeat(4,1fr)}
  .card{flex-basis:170px}.card img{width:170px;height:170px}
}
@media(prefers-reduced-motion:reduce){#full{transition:none}}
</style>
</head>
<body>
<nav id="nav">
  <div class="logo">Mi Música</div>
  <button data-v="vHome" class="on"><svg viewBox="0 0 24 24"><path d="M12.5 3.2a1 1 0 0 0-1 0L3 8.1V21h6.5v-6.5h5V21H21V8.1z"/></svg>Inicio</button>
  <button data-v="vSearch"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.5 13.5l4.5 4.5 1.5-1.5-4.5-4.5A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>Buscar</button>
  <button data-v="vLib"><svg viewBox="0 0 24 24"><path d="M3 22V2h2v20zm5 0V2h2v20zm5.5-19.5 7.7 1.8L16.5 22l-7.7-1.8z"/></svg>Tu biblioteca</button>
</nav>

<main>
  <section id="vHome" class="view on">
    <h1 id="saludo">Hola</h1>
    <div class="atajos" id="atajos"></div>
    <div id="filas"></div>
  </section>

  <section id="vSearch" class="view">
    <h1>Buscar</h1>
    <div class="caja">
      <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.5 13.5l4.5 4.5 1.5-1.5-4.5-4.5A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>
      <input id="q" type="search" placeholder="Artistas o canciones" enterkeyhint="search">
    </div>
    <div id="resBusca"></div>
    <div id="generos" class="generos" style="margin-top:20px"></div>
  </section>

  <section id="vLib" class="view">
    <h1>Tu biblioteca</h1>
    <button class="meGusta" id="abrirMG">
      <div class="ic"><svg viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M12 21s-8-5.3-8-11a4.7 4.7 0 0 1 8-3.3A4.7 4.7 0 0 1 20 10c0 5.700-8 11-8 11z"/></svg></div>
      <div><b>Canciones que te gustan</b><span id="nMG">0 canciones</span></div>
    </button>
    <div class="copia">
      <button id="btnExp">Guardar copia</button>
      <button id="btnImp">Restaurar copia</button>
      <input id="fileImp" type="file" accept=".json,application/json" hidden>
    </div>
    <p id="aviso" class="msg" hidden></p>
  </section>

  <section id="vList" class="view">
    <div class="cab"><button class="vol" id="atras" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M15.5 3.5 7 12l8.500 8.500 1.500-1.500L10 12l7-7z"/></svg></button></div>
    <h1 id="listaTit"></h1>
    <div class="acciones">
      <button class="bigplay" id="lpPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
      <button id="lpShuf" aria-label="Aleatorio" style="color:var(--soft)"><svg viewBox="0 0 24 24"><path d="M16 3h5v5l-2-2-4.500 4.500-1.400-1.400L17.600 5zM3 6h4.500l9 11H21v2h-5.500L7 8H3zm0 11h4l2-2.500 1.300 1.600L8 19H3zm13.500-1.500 2.500-2.500L21 15v5h-5l2-2z"/></svg></button>
    </div>
    <div id="listaPistas"></div>
  </section>
</main>

<div id="toast"></div>
<div id="mini">
  <img id="mImg" alt="">
  <div class="inf" id="mAbrir"><b id="mTit"></b><span id="mArt"></span></div>
  <button class="heart" id="mHeart" aria-label="Me gusta"></button>
  <button id="mPlay" aria-label="Reproducir o pausar"></button>
  <div class="prog"><i id="mProg"></i></div>
</div>

<div id="full">
  <div class="top">
    <button id="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M3.500 8.500 5 7l7 7 7-7 1.500 1.500L12 17z"/></svg></button>
    <span>Reproduciendo</span><span style="width:28px"></span>
  </div>
  <div class="cover"><div id="ytwrap"><div id="yt"></div></div></div>
  <div class="tit"><div><b id="fTit"></b><span id="fArt"></span></div><button class="heart" id="fHeart" aria-label="Me gusta"></button></div>
  <input id="barra" type="range" min="0" max="1000" value="0">
  <div class="tiempos"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctrl">
    <button id="shuf" aria-label="Aleatorio"></button>
    <button id="prev" aria-label="Anterior"></button>
    <button class="pp" id="fPlay" aria-label="Reproducir o pausar"></button>
    <button id="next" aria-label="Siguiente"></button>
    <button id="rep" aria-label="Repetir"></button>
  </div>
</div>

<script>
// 1) PEGA AQUÍ TU CLAVE (API KEY) DE YOUTUBE
const YT_KEY = "AIzaSyCTJF2b4kCQf4Ew6HREOe-hgDAoF8fuJ8E";

const API = "https://www.googleapis.com/youtube/v3/";
const $ = id => document.getElementById(id);
const I = {
  play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm13 0v14L9 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7L5 19z"/></svg>',
  shuf:'<svg viewBox="0 0 24 24"><path d="M16 3h5v5l-2-2-4.500 4.500-1.400-1.400L17.600 5zM3 6h4.500l9 11H21v2h-5.500L7 8H3zm0 11h4l2-2.500 1.300 1.600L8 19H3zm13.500-1.500 2.500-2.500L21 15v5h-5l2-2z"/></svg>',
  rep:'<svg viewBox="0 0 24 24"><path d="M4 7h13V4l4 4-4 4V9H6v4H4zm16 10H7v3l-4-4 4-4v3h11v-4h2z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.500s-8-5-8-10.700A4.600 4.600 0 0 1 12 7a4.600 4.600 0 0 1 8 2.800c0 5.700-8 10.700-8 10.700zm0-2.400c2.500-1.700 6-4.800 6-8.300 0-1.500-1-2.600-2.400-2.600-1.200 0-2.300.9-2.900 2.100h-1.400C10.700 8.100 9.600 7.200 8.400 7.200 7 7.200 6 8.300 6 9.800c0 3.500 3.500 6.600 6 8.300z"/></svg>',
  heartOn:'<svg viewBox="0 0 24 24"><path d="M12 20.500s-8-5-8-10.700A4.600 4.600 0 0 1 12 7a4.600 4.600 0 0 1 8 2.800c0 5.700-8 10.700-8 10.700z"/></svg>'
};
const COLORES = ["#dc148c","#8d67ab","#e8115b","#1e3264","#148a08","#e13300","#0d73ec","#7358ff","#b49bc8","#477d95","#ba5d07","#503750"];
const GENEROS = [["Pop","pop hits"],["Reguetón","reggaeton hits"],["Rock","rock hits"],["Hip hop","hip hop hits"],["Salsa","salsa hits"],["Bachata","bachata hits"],["Cumbia","cumbia hits"],["Electrónica","electronic dance hits"],["Baladas","baladas románticas"],["Regional mexicano","regional mexicano hits"],["Jazz","jazz classics"],["Clásica","classical music"]];
// Países para "Lo más escuchado" (puedes cambiar los códigos)
const MI_PAIS = ((navigator.language || "es-ES").split("-")[1] || "ES").toUpperCase();
const PAISES = [MI_PAIS, ...["MX", "ES", "US", "AR", "CO"].filter(p => p !== MI_PAIS)];
const nombrePais = c => { try { return new Intl.DisplayNames(["es"], { type: "region" }).of(c); } catch (e) { return c; } };

let cola = [], idx = -1, aleatorio = false, repetir = false, listaVista = [];
let favs = [];
try { favs = JSON.parse(localStorage.getItem("favsYT") || "[]"); } catch (e) {}
const esFav = id => favs.some(f => f.id === id);

function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", 4500); }
function msgError(e) {
  const m = String(e && e.message || e);
  if (/quota/i.test(m)) return "Se agotó el límite diario de YouTube. Vuelve mañana.";
  if (/keyInvalid|badRequest|API key/i.test(m)) return "La clave de YouTube no es válida. Revisa YT_KEY en index.html.";
  if (/accessNotConfigured|has not been used|disabled/i.test(m)) return "Activa “YouTube Data API v3” en tu proyecto de Google.";
  if (/forbidden|referer|ipRefererBlocked/i.test(m)) return "Tu clave está bloqueada para este sitio. Revisa sus restricciones.";
  return "No se pudo cargar. Revisa tu internet y tu clave.";
}

/* ---------- YouTube ---------- */
const decodificar = t => new DOMParser().parseFromString(t, "text/html").documentElement.textContent;
function limpiar(v) {
  const sn = v.snippet;
  let t = decodificar(sn.title)
    .replace(/\s*[\(\[][^\)\]]*(official|oficial|video|vídeo|lyric|letra|audio|visuali[sz]er|4k|hd|mv)[^\)\]]*[\)\]]/gi, "")
    .replace(/\s*\|.*$/, "").trim();
  let a = decodificar(sn.channelTitle).replace(/VEVO$/i, "").replace(/\s*-\s*Topic$/i, "").trim(), n = t;
  const m = t.match(/^(.{2,60}?)\s[-–]\s(.+)$/);
  if (m) { a = m[1]; n = m[2]; }
  const id = typeof v.id === "string" ? v.id : v.id.videoId;
  return { src: "yt", id, name: n, artist_name: a, image: (sn.thumbnails.medium || sn.thumbnails.default).url };
}
// Guarda las respuestas unas horas para gastar menos límite diario
async function yt(ruta, params, horas = 6) {
  const clave = "c:" + ruta + "?" + new URLSearchParams(params).toString();
  try { const c = JSON.parse(localStorage.getItem(clave) || "null"); if (c && Date.now() - c.t < horas * 3600e3) return c.d; } catch (e) {}
  const r = await fetch(API + ruta + "?" + new URLSearchParams({ ...params, key: YT_KEY }));
  const d = await r.json();
  if (d.error) throw new Error((d.error.errors && d.error.errors[0] && d.error.errors[0].reason) || d.error.message);
  const lista = (d.items || []).filter(v => v.snippet).map(limpiar);
  try { localStorage.setItem(clave, JSON.stringify({ t: Date.now(), d: lista })); } catch (e) {}
  return lista;
}
const populares = pais => yt("videos", { part: "snippet", chart: "mostPopular", videoCategoryId: "10", regionCode: pais, maxResults: "25" });
const buscarYT = q => yt("search", { part: "snippet", q, type: "video", videoCategoryId: "10", videoEmbeddable: "true", maxResults: "25" }, 24);

/* ---------- navegación ---------- */
function ver(v) {
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === v));
  const tabNav = v === "vList" ? "vLib" : v;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === tabNav));
  if (v === "vLib") $("nMG").textContent = favs.length + (favs.length === 1 ? " canción" : " canciones");
  window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => ver(b.dataset.v));

/* ---------- inicio ---------- */
function fila(titulo, pistas) {
  const sec = document.createElement("div");
  sec.innerHTML = `<h2></h2><div class="fila"></div>`;
  sec.querySelector("h2").textContent = titulo;
  const f = sec.querySelector(".fila");
  pistas.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<img src="${c.image}" alt=""><b></b><span></span>`;
    b.querySelector("b").textContent = c.name;
    b.querySelector("span").textContent = c.artist_name;
    b.onclick = () => reproducir(pistas, i);
    f.appendChild(b);
  });
  return sec;
}
async function inicio() {
  const h = new Date().getHours();
  $("saludo").textContent = h < 12 ? "Buenos días" : h < 20 ? "Buenas tardes" : "Buenas noches";
  $("filas").innerHTML = '<p class="msg">Cargando…</p>';
  $("atajos").innerHTML = "";
  let primero = true, primerError = null;
  $("filas").innerHTML = "";
  for (const p of PAISES) {
    try {
      const lista = await populares(p);
      if (!lista.length) continue;
      if (primero) {
        primero = false;
        lista.slice(0, 6).forEach((c, i) => {
          const b = document.createElement("button");
          b.className = "atajo";
          b.innerHTML = `<img src="${c.image}" alt=""><b></b>`;
          b.querySelector("b").textContent = c.name;
          b.onclick = () => reproducir(lista, i);
          $("atajos").appendChild(b);
        });
      }
      $("filas").appendChild(fila("Lo más escuchado en " + nombrePais(p), lista));
    } catch (e) { if (!primerError) primerError = e; if (/quota|keyInvalid|accessNotConfigured|forbidden/i.test(String(e.message))) break; }
  }
  if (primero) $("filas").innerHTML = '<p class="msg">' + msgError(primerError) + "</p>";
}

/* ---------- buscar ---------- */
GENEROS.forEach(([nombre, q], i) => {
  const b = document.createElement("button");
  b.className = "gen";
  b.style.background = COLORES[i % COLORES.length];
  b.textContent = nombre;
  b.onclick = async () => {
    listaVista = []; $("listaTit").textContent = nombre; $("listaPistas").innerHTML = '<p class="msg">Cargando…</p>'; ver("vList");
    try { abrirLista(nombre, await buscarYT(q)); } catch (e) { $("listaPistas").innerHTML = '<p class="msg">' + msgError(e) + "</p>"; }
  };
  $("generos").appendChild(b);
});
async function buscar() {
  const t = $("q").value.trim();
  if (!t) { $("resBusca").innerHTML = ""; $("generos").style.display = ""; return; }
  $("generos").style.display = "none";
  $("resBusca").innerHTML = '<p class="msg">Buscando…</p>';
  try {
    const r = await buscarYT(t);
    if (!r.length) { $("resBusca").innerHTML = '<p class="msg">No encontramos resultados.</p>'; return; }
    pintar($("resBusca"), r);
  } catch (e) { $("resBusca").innerHTML = '<p class="msg">' + msgError(e) + "</p>"; }
}
$("q").onkeydown = e => { if (e.key === "Enter") { e.target.blur(); buscar(); } };
$("q").oninput = () => { if (!$("q").value.trim()) buscar(); };

/* ---------- listas ---------- */
function pintar(cont, pistas) {
  cont.innerHTML = "";
  pistas.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "fila-t";
    d.dataset.id = c.id;
    if (cola[idx] && cola[idx].id === c.id) d.classList.add("suena");
    d.innerHTML = `<img src="${c.image}" alt=""><button class="inf"><b></b><span></span></button><button class="heart" data-id="${c.id}"></button>`;
    d.querySelector("b").textContent = c.name;
    d.querySelector("span").textContent = c.artist_name;
    d.querySelector(".inf").onclick = () => reproducir(pistas, i);
    d.querySelector(".heart").onclick = () => meGusta(c);
    cont.appendChild(d);
  });
  pintarCorazones();
}
function abrirLista(titulo, pistas) {
  listaVista = pistas;
  $("listaTit").textContent = titulo;
  if (!pistas.length) $("listaPistas").innerHTML = '<p class="msg">Aún no hay canciones aquí. Toca el corazón en cualquier canción para guardarla.</p>';
  else pintar($("listaPistas"), pistas);
  ver("vList");
}
$("abrirMG").onclick = () => abrirLista("Canciones que te gustan", [...favs]);
$("atras").onclick = () => ver("vLib");
$("lpPlay").onclick = () => { if (listaVista.length) reproducir(listaVista, aleatorio ? Math.floor(Math.random() * listaVista.length) : 0); };
$("lpShuf").onclick = () => { aleatorio = !aleatorio; actualizarUI(); };

/* ---------- me gusta ---------- */
function meGusta(c) {
  const i = favs.findIndex(f => f.id === c.id);
  if (i >= 0) favs.splice(i, 1); else favs.push(c);
  try { localStorage.setItem("favsYT", JSON.stringify(favs)); } catch (e) {}
  pintarCorazones();
  if ($("vList").classList.contains("on") && $("listaTit").textContent === "Canciones que te gustan") abrirLista("Canciones que te gustan", [...favs]);
}
function pintarCorazones() {
  document.querySelectorAll(".heart[data-id]").forEach(h => {
    const on = esFav(h.dataset.id);
    h.classList.toggle("on", on);
    h.innerHTML = on ? I.heartOn : I.heart;
  });
}

/* ---------- reproductor (YouTube) ---------- */
let yp = null, listo = false, sonando = false, erroresSeguidos = 0;
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);
window.onYouTubeIframeAPIReady = () => {
  yp = new YT.Player("yt", {
    width: "100%", height: "100%",
    playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1, disablekb: 1, fs: 0 },
    events: {
      onReady: () => { listo = true; if (cola[idx]) cargarPista(); },
      onStateChange: e => {
        sonando = e.data === 1 || e.data === 3;
        if (e.data === 1) erroresSeguidos = 0;
        if (e.data === 0) siguiente();
        actualizarUI();
      },
      onError: () => {
        erroresSeguidos++;
        if (erroresSeguidos > 4) { toast("No se pudo reproducir. Prueba otra canción."); return; }
        toast("Esa canción no se puede reproducir aquí. Pasando a la siguiente…");
        siguiente();
      }
    }
  });
};
function reproducir(lista, i) { cola = lista; idx = i; erroresSeguidos = 0; cargarPista(); }
function cargarPista() {
  const c = cola[idx];
  if (!c) return;
  actualizarUI();
  if (!listo) { toast("Cargando el reproductor…"); return; }
  yp.loadVideoById(c.id);
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: c.name, artist: c.artist_name, artwork: [{ src: c.image, sizes: "320x180" }] });
    navigator.mediaSession.setActionHandler("nexttrack", siguiente);
    navigator.mediaSession.setActionHandler("previoustrack", anterior);
    navigator.mediaSession.setActionHandler("play", alternar);
    navigator.mediaSession.setActionHandler("pause", alternar);
  }
}
function siguiente() {
  if (!cola.length) return;
  if (aleatorio) idx = Math.floor(Math.random() * cola.length);
  else if (idx + 1 < cola.length) idx++;
  else if (repetir) idx = 0;
  else { if (listo) yp.pauseVideo(); return; }
  cargarPista();
}
function anterior() {
  if (listo && yp.getCurrentTime() > 3) { yp.seekTo(0, true); return; }
  if (idx > 0) { idx--; cargarPista(); }
}
function alternar() { if (!listo || idx < 0) return; yp.getPlayerState() === 1 ? yp.pauseVideo() : yp.playVideo(); }
function actualizarUI() {
  const c = cola[idx];
  if (c) {
    $("mini").classList.add("on");
    $("mImg").src = c.image;
    $("mTit").textContent = $("fTit").textContent = c.name;
    $("mArt").textContent = $("fArt").textContent = c.artist_name;
    $("mHeart").dataset.id = $("fHeart").dataset.id = c.id;
    const hue = [...String(c.id)].reduce((a, ch) => a + ch.charCodeAt(0) * 37, 0) % 360;
    const col = `hsl(${hue} 30% 28%)`;
    $("mini").style.background = window.innerWidth >= 800 ? "#000" : col;
    $("full").style.background = `linear-gradient(${col},#121212 75%)`;
  }
  $("mPlay").innerHTML = sonando ? I.pause : I.play;
  $("fPlay").innerHTML = sonando ? I.pause : I.play;
  $("prev").innerHTML = I.prev; $("next").innerHTML = I.next;
  $("shuf").innerHTML = I.shuf; $("rep").innerHTML = I.rep;
  $("shuf").className = aleatorio ? "on" : "";
  $("rep").className = repetir ? "on" : "";
  $("lpShuf").style.color = aleatorio ? "var(--g)" : "var(--soft)";
  document.querySelectorAll(".fila-t").forEach(f => f.classList.toggle("suena", !!c && f.dataset.id == c.id));
  pintarCorazones();
}
$("mPlay").onclick = alternar; $("fPlay").onclick = alternar;
$("next").onclick = siguiente; $("prev").onclick = anterior;
$("shuf").onclick = () => { aleatorio = !aleatorio; actualizarUI(); };
$("rep").onclick = () => { repetir = !repetir; actualizarUI(); };
$("mHeart").onclick = () => cola[idx] && meGusta(cola[idx]);
$("fHeart").onclick = () => cola[idx] && meGusta(cola[idx]);
$("mAbrir").onclick = () => $("full").classList.add("on");
$("mImg").onclick = () => $("full").classList.add("on");
$("cerrar").onclick = () => $("full").classList.remove("on");
const fmt = t => isFinite(t) && t > 0 ? Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") : "0:00";
setInterval(() => {
  if (!listo || idx < 0 || !yp.getDuration) return;
  const d = yp.getDuration(), t = yp.getCurrentTime();
  if (!d) return;
  $("mProg").style.width = t / d * 100 + "%";
  if (!arrastrando) $("barra").value = t / d * 1000;
  $("t1").textContent = fmt(t); $("t2").textContent = fmt(d);
}, 500);
let arrastrando = false;
$("barra").onpointerdown = () => arrastrando = true;
$("barra").onpointerup = () => arrastrando = false;
$("barra").oninput = e => { if (listo && yp.getDuration()) yp.seekTo(e.target.value / 1000 * yp.getDuration(), true); };

/* ---------- guardado permanente y copias ---------- */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
function aviso(t) { $("aviso").textContent = t; $("aviso").hidden = false; setTimeout(() => $("aviso").hidden = true, 4000); }
$("btnExp").onclick = () => {
  const blob = new Blob([JSON.stringify(favs)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "mis-favoritas.json"; a.click();
  aviso("Copia guardada en Descargas. Consérvala en un lugar seguro.");
};
$("btnImp").onclick = () => $("fileImp").click();
$("fileImp").onchange = async e => {
  try {
    const l = JSON.parse(await e.target.files[0].text());
    l.forEach(c => { if (c && c.src === "yt" && c.id && !favs.some(f => f.id === c.id)) favs.push(c); });
    localStorage.setItem("favsYT", JSON.stringify(favs));
    $("nMG").textContent = favs.length + " canciones";
    aviso("Favoritas restauradas: " + favs.length);
  } catch (err) { aviso("Ese archivo no es válido."); }
};

actualizarUI();
inicio();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
